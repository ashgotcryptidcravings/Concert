workflows:
  testflight-internal:
    name: Concert - TestFlight Internal Only
    max_build_duration: 120
    instance_type: mac_mini_m2

    # Create this App Store Connect integration in Codemagic with an App Manager API key.
    integrations:
      app_store_connect: Codemagic Latest

    environment:
      groups:
        - ios_signing
      # Use Codemagic's Xcode 27.2 edge image.
      xcode: "27.2"
      # Signing profiles are fetched or created by the App Store Connect CLI step below.
      vars:
        BUNDLE_ID: Foundation.Concert
        LIVE_ACTIVITY_BUNDLE_ID: Foundation.Concert.LiveActivity
        XCODE_PROJECT: Concert.xcodeproj
        XCODE_SCHEME: Concert

    scripts:
      - name: Initialize signing keychain
        script: keychain initialize

      - name: Fetch app and Live Activity signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files "$LIVE_ACTIVITY_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Install signing certificate
        script: keychain add-certificates

      - name: Configure signing for internal TestFlight
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Set the TestFlight build number
        script: |
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Internal-only export skips external TestFlight beta review and App Store review.
        submit_to_testflight: false
        submit_to_app_store: false
